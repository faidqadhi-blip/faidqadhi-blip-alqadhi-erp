
name: AlQadhi disposable real Auth acceptance

on:
  workflow_dispatch:

jobs:
  accept:
    name: Test only - never deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      TEST_SUPABASE_PROJECT_ID: uddoevymsrzceqoxpokn
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ALQADHI_TEST_SERVICE_ROLE_KEY }}
      TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ALQADHI_TEST_PUBLISHABLE_KEY }}
      TEST_PASSWORD_CREATOR: ${{ secrets.ALQADHI_TEST_PASSWORD_CREATOR }}
      TEST_PASSWORD_REVIEWER: ${{ secrets.ALQADHI_TEST_PASSWORD_REVIEWER }}
      TEST_PASSWORD_APPROVER: ${{ secrets.ALQADHI_TEST_PASSWORD_APPROVER }}
      TEST_PASSWORD_READONLY: ${{ secrets.ALQADHI_TEST_PASSWORD_READONLY }}
      ACCEPTANCE_EVIDENCE_PATH: acceptance-evidence.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      
      - name: Sync Reviewer password - test only
        run: |
          node --input-type=module <<'NODE'
          const url = "https://uddoevymsrzceqoxpokn.supabase.co/auth/v1/admin/users/5e625f98-6e13-4b15-a36c-4e832953238e";
          const response = await fetch(url, {
            method: "PUT",
            headers: {
              apikey: process.env.TEST_SUPABASE_SERVICE_ROLE_KEY,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              password: process.env.TEST_PASSWORD_REVIEWER
            })
          });
          if (!response.ok) {
            throw new Error(`Password sync failed: HTTP ${response.status}`);
          }
          console.log("Reviewer password updated in Disposable Test");
          NODE
